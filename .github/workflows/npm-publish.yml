name: Publish (npm)

# Publishes the package to npmjs on a v* tag. Publication is gated on a `verify` job that runs the same workflow as CI (audit,
# type-check, lint, unit tests, build, package contents, and the real-browser contrast gate in all five browsers, one job per
# browser in Playwright's image) on the exact tagged commit, so a broken tag never ships. (It used to repeat the checks in one job
# with `playwright install --with-deps`, the slow apt install D129 replaced everywhere else.)
# Authentication uses npm OIDC trusted publishing — no long-lived NPM_TOKEN.

# Only a pushed tag that starts with `v` (the release process tags `v<version>`).
on:
  push:
    tags:
      - 'v*'

# Read-only by default; the publish job below adds the one extra permission it needs.
permissions:
  contents: read

# No tool may phone home from CI (the fleet's privacy rule).
env:
  DO_NOT_TRACK: "1"

jobs:
  # The Node CI workflow, reused on the tagged commit: publishing waits for it (`needs: verify`).
  verify:
    name: Verify (CI checks)
    uses: ./.github/workflows/node-ci.yml

  # The one job that publishes: it checks the tag against the package version first.
  publish-npm:
    name: npmjs (@meddleware/walrus-storage-kit)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing
    steps:
      # Actions are pinned by full commit SHA with the version in a comment (D12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 24 ships an older npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.20.0
      # `npm ci` installs exactly the lockfile.
      - name: Install dependencies
        run: npm ci
      # The package has no build script (it ships source), so this is a no-op kept so the workflow matches the other packages.
      - name: Build
        run: npm run build --if-present
      # A tag `v0.1.44` must be a package.json at `0.1.44`: otherwise the wrong version would be published under that tag.
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      # Idempotent, so a re-run of the job after the version is on npm leaves it green. `--provenance` signs the build's origin into the registry (Sigstore).
      - name: Publish to npmjs (OIDC, idempotent)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          ENC=$(printf '%s' "$NAME" | sed 's#/#%2f#')
          # Check the registry directly — `npm view` can transiently miss a freshly
          # first-published version and then attempt a re-publish. A 200 means it's live.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${ENC}/${VERSION}")" = "200" ]; then
            echo "::notice::v${VERSION} already published to npmjs — skipping."
          else
            # Publish, but treat a "version already exists" error as success so a
            # manually-published version (or a registry race) leaves the job green.
            set +e; OUT=$(npm publish --provenance --access public 2>&1); RC=$?; set -e
            printf '%s\n' "$OUT"
            if [ "$RC" -ne 0 ]; then
              if printf '%s' "$OUT" | grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT'; then
                echo "::notice::v${VERSION} already published — treating as success."
              else
                exit "$RC"
              fi
            fi
          fi
